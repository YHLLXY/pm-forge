[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pmforge-evals"
version = "0.1.0"
description = "pm-forge 二期 A2：toolkit 三工具 evals 门禁（评测集 / 结构检查 / LLM-as-judge / 校准 / 基线回归）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.16.9"]

[project.scripts]
evals = "evals.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
