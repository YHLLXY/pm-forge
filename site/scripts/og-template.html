<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      }
      .frame {
        width: 100%;
        height: 100%;
        background: #fdfdfd;
        display: flex;
      }
      .bar {
        width: 28px;
        height: 100%;
        background: #006cac;
      }
      .content {
        flex: 1;
        padding: 90px 80px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      h1 {
        font-size: 72px;
        font-weight: 700;
        color: #282728;
        letter-spacing: 2px;
      }
      .subtitle {
        margin-top: 28px;
        font-size: 30px;
        color: #6b7280;
        letter-spacing: 4px;
      }
      .subtitle b {
        color: #006cac;
        font-weight: 600;
      }
      .footer {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
      }
      .tagline {
        font-size: 22px;
        color: #9ca3af;
      }
      .host {
        font-size: 26px;
        font-weight: 700;
        color: #006cac;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="bar"></div>
      <div class="content">
        <div>
          <h1>余翰林 · 产品作品集</h1>
          <p class="subtitle">案例研究 / 数据分析 / <b>AI PM 工具箱</b></p>
        </div>
        <div class="footer">
          <span class="tagline">每个结论都有证据链</span>
          <span class="host">yuhailinlxy.com</span>
        </div>
      </div>
    </div>
  </body>
</html>
