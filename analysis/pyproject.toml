[project]
name = "pmforge-analysis"
version = "0.1.0"
description = "pm-forge 数据分析模块：UserBehavior 指标体系/漏斗/RFM（M1）"
readme = "README.md"
authors = [
    { name = "YHLLXY", email = "3244780834@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyterlab>=4.6.4",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
